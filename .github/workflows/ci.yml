name: CI

on:
  push:
    branches:
      - main
      - codex/cumulative-labs-homepage-foundation
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Validate production output
        run: npm run validate:build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-labs-homepage-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
