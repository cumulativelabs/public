name: Live Preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/cumulative-labs-homepage-foundation

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cumulative-labs-live-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build live preview
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${BASE_PATH:-/public}/"

      - name: Validate production output
        run: npm run validate:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live preview
        id: deployment
        uses: actions/deploy-pages@v4
